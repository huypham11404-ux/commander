[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commander"
version = "1.0.0"
description = "AI Music Production Commander"
authors = [{ name = "Commander Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.0",
    "pretty_midi>=0.2.10",
    "music21>=9.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "websockets>=12.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
